[project]
name = "ai-doc-helper-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Doc Helper extension"
requires-python = ">=3.9"
dependencies = [
  "bs4>=0.0.2",
  "fastapi",
  "httpx>=0.28.1",
  "ipykernel>=6.31.0",
  "packaging>=25.0",
  "pytest>=8.4.2",
  "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 👇 tell hatch which code to include
[tool.hatch.build.targets.wheel]
packages = ["app"]
