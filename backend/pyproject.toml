[project]
name = "ai-doc-helper-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Doc Helper extension"
requires-python = ">=3.9"
dependencies = [
  "fastapi",
  "uvicorn[standard]"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 👇 tell hatch which code to include
[tool.hatch.build.targets.wheel]
packages = ["app"]
